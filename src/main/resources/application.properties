spring.profiles.active=${APP_PROFILE:local}
flyway.out-of-order=true

# O front anuncia "5MB cada" para upload de documentos; sem isto valem os defaults do
# Spring Boot (1MB por arquivo / 10MB por request), que bloqueiam upload legitimo.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
